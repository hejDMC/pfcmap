runPete1:
    state: 'active'
    tsel: 'prestim'
    layerlist: 'all'
    reftag: 'all'
    spec: 'dur1'
    datasets: ['Pete_Rudebeck']
    tasks: ['Pete_Rudebeck']#
    imetrics:
      features: ['B_mean','M_mean','rate_mean']
      weights: [1,1,1]
    wmetrics:
      features: []#['peak2Trough','abRatio','p2tRatio']
      weights: []#[1,1,1]
    utypes: ['ww']
    nnodes: 220
    clustering:
      ward: [5,6,7,8,9]

